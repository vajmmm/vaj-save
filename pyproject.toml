[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vajsave"
version = "0.1.0"
description = "Handheld save backup and version manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "vaj-save team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
vajsave = "vajsave.cli:main"
vajsave-app = "vajsave.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vajsave.data" = ["libretro/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=vajsave --cov-report=term-missing --cov-branch"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "*/app_ui.py",
    "*/app.py",
    "*/pixel_style.py",
    "src/vajsave/app_ui.py",
    "src/vajsave/app.py",
    "src/vajsave/pixel_style.py",
]
